[project]
name = "spegel"
version = "0.1.3"
description = "Spegel - Reflect the web through AI. A terminal browser with multiple AI-powered views."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Simon Edwardsson", email = "simon.edwardsson@gmail.com"},
]
keywords = ["terminal", "browser", "ai", "llm", "web", "tui", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
    "Topic :: Text Processing :: Markup :: HTML",
]

dependencies = [
    "beautifulsoup4>=4.15.0",
    "html2text>=2025.4.15",
    "litellm>=1.106.2",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "textual>=8.2.8",
    "pydantic>=2.14.1",
]

[project.urls]
"Homepage" = "https://github.com/simedw/spegel"
"Repository" = "https://github.com/simedw/spegel"
"Bug Tracker" = "https://github.com/simedw/spegel/issues"
"Documentation" = "https://github.com/simedw/spegel#readme"

[project.scripts]
spegel = "spegel.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/spegel",
    "/tests",
    "/README.md",
    "/env_example.txt",
    "/example_config.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
